version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - identity-service
      - customer-service
      - order-service
      - product-service
      - notification-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Strangler routing for the Identity domain. Cutover = point this at identity-service; rollback = back to the monolith.
      - ReverseProxy__Clusters__identity-strangler-cluster__Destinations__active__Address=${IDENTITY_STRANGLER_DESTINATION:-http://host.docker.internal:5225/}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  identity-service:
    build:
      context: .
      dockerfile: Services/Identity/Identity.API/Dockerfile
    ports:
      - "5001:5001"
    depends_on:
      - postgres
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=identitydb;Username=postgres;Password=postgres
      # Reverse sync (identitydb -> monolith). Leave enabled until Identity is permanently accepted.
      - ConnectionStrings__MonolithConnection=${MONOLITH_CONNECTION:-}
      - ReverseSync__Enabled=${REVERSE_SYNC_ENABLED:-false}
      # Shared OpenIddict PFX (same file + password as the monolith). Mount it read-only; never bake it into the image.
      - OIDC__Issuer=${OIDC_ISSUER:-}
      - OIDC__Certificates__Path=${OIDC_CERT_PATH:-}
      - OIDC__Certificates__Password=${OIDC_CERT_PASSWORD:-}
      - OIDC__Certificates__RequireShared=${OIDC_REQUIRE_SHARED_CERT:-false}
    volumes:
      # Drop the monolith's PFX into ./certs and set OIDC_CERT_PATH=/certs/<file>.pfx
      - ${OIDC_CERT_DIR:-./certs}:/certs:ro

  customer-service:
    build:
      context: .
      dockerfile: Services/Customer/Customer.API/Dockerfile
    ports:
      - "5002:5002"
    depends_on:
      - postgres
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=customerdb;Username=postgres;Password=postgres

  order-service:
    build:
      context: .
      dockerfile: Services/Order/Order.API/Dockerfile
    ports:
      - "5003:5003"
    depends_on:
      - postgres
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=orderdb;Username=postgres;Password=postgres

  product-service:
    build:
      context: .
      dockerfile: Services/Product/Product.API/Dockerfile
    ports:
      - "5004:5004"
    depends_on:
      - postgres
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=productdb;Username=postgres;Password=postgres

  notification-service:
    build:
      context: .
      dockerfile: Services/Notification/Notification.API/Dockerfile
    ports:
      - "5005:5005"
    depends_on:
      - postgres
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=notificationdb;Username=postgres;Password=postgres

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # ---------------------------------------------------------------------------
  # Identity strangler migration infrastructure (docker compose --profile migration up)
  # ---------------------------------------------------------------------------
  sqlserver:
    # Local stand-in for the monolith database. Point MONOLITH_DB_* at the real server in shared environments.
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [migration]
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MONOLITH_DB_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_AGENT_ENABLED: "true"   # SQL Server Agent is required for CDC capture jobs
    volumes:
      - sqlserver_data:/var/opt/mssql

  kafka:
    image: apache/kafka:3.9.0
    profiles: [migration]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: identity-migration-cluster-0001

  connect:
    # Debezium: SQL Server source (monolith) -> Kafka -> JDBC sink (identitydb). Forward sync only.
    build:
      context: ./cdc
      dockerfile: Dockerfile.connect
    profiles: [migration]
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: identity-migration
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      MONOLITH_DB_HOST: ${MONOLITH_DB_HOST:-sqlserver}
      MONOLITH_DB_PORT: ${MONOLITH_DB_PORT:-1433}
      MONOLITH_DB_USER: ${MONOLITH_DB_USER:-sa}
      MONOLITH_DB_PASSWORD: ${MONOLITH_DB_PASSWORD:-YourStrong!Passw0rd}
      IDENTITY_DB_HOST: postgres
      IDENTITY_DB_PORT: 5432
      IDENTITY_DB_USER: postgres
      IDENTITY_DB_PASSWORD: postgres

volumes:
  postgres_data:
  sqlserver_data:
